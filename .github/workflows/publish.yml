name: Publish Extension

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-extension]

jobs:
  publish:
    if: github.repository == 'team-attention/code-squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build core
        run: pnpm --filter @code-squad/core clean && pnpm --filter @code-squad/core build

      - name: Build vscode extension
        run: pnpm --filter code-squad build

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode
        run: vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to Open VSX (Cursor)
        working-directory: packages/vscode
        run: ovsx publish -p ${{ secrets.OVSX_PAT }} --no-dependencies
