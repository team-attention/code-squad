name: Publish CLI

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'team-attention/code-squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build CLI
        run: pnpm --filter code-squad-cli build

      - name: Publish to npm
        run: pnpm --filter code-squad-cli publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
